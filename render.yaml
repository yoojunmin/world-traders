services:
  - type: web
    name: world-traders
    runtime: node
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm run db:migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: world-traders-db
          property: connectionString
      - key: CLIENT_ORIGIN
        value: https://world-traders.onrender.com
databases:
  - name: world-traders-db
    plan: basic-256mb
    databaseName: worldtraders
    user: worldtraders
